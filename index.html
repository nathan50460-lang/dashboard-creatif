<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DASHBOARD_CREATIF.exe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="rain"></canvas>

<nav id="sidebar">

  <!-- ── CLICKER ── -->
  <div id="clicker-area">
    <div id="ship-wrap">
      <pre id="ship" onclick="clickShip(event)">   /\
  /\/\
 / <span class="ship-core">✦</span>  \
/______\
  |  |
 _|__|_</pre>
      <div id="click-particles"></div>
    </div>
    <div id="pts-display"><span id="pts">0</span> <span class="pts-unit">CYCLES</span></div>
    <div id="pps-display">+<span id="pps">0.0</span>/s · ×<span id="cpc">1</span>/clic</div>
  </div>

  <!-- ── TABS ── -->
  <div id="sidebar-tabs">
    <button class="stab active" id="tab-nav"  onclick="setTab('nav')">[ NAV ]</button>
    <button class="stab"        id="tab-shop" onclick="setTab('shop')">[ SHOP ]</button>
  </div>

  <!-- ── SEARCH (nav mode) ── -->
  <div id="sb-search"><input type="text" id="search" placeholder="rechercher..." autocomplete="off"></div>

  <!-- ── NAV LIST ── -->
  <div id="nav"></div>

  <!-- ── SHOP LIST ── -->
  <div id="shop" style="display:none"></div>

</nav>

<main id="main">
  <div id="sections"></div>
</main>

<!-- characters float here -->
<div id="char-layer"></div>

<!-- floating +N feedback -->
<div id="global-feedback"></div>

<!-- ── DETAIL PANEL ── -->
<aside id="detail-panel">
  <button id="detail-close" onclick="closeDetail()">[ × FERMER ]</button>
  <div id="detail-img-wrap"><div id="detail-img-inner"></div></div>
  <div id="detail-meta">
    <div id="detail-name"></div>
    <span id="detail-tag-badge"></span>
  </div>
  <div id="detail-story"></div>
  <div id="detail-keys"></div>
</aside>
<div id="detail-backdrop" onclick="closeDetail()"></div>

<!-- ── BATTLE POPUP ── -->
<div id="battle-popup">
  <div id="battle-inner">
    <div id="battle-enemy-sprite"></div>
    <div id="battle-enemy-name"></div>
    <div id="battle-intro"></div>
    <div id="battle-hp-bar-wrap"><div id="battle-hp-fill"></div></div>
    <div id="battle-hp-text"></div>
    <div id="battle-attack-log"></div>
    <button id="battle-btn" onclick="battleClick()">[ ⚡ ATTAQUER ]</button>
    <div id="battle-result"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
